<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Questionnaire RSE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .question-card {
      margin-bottom: 1rem;
      padding: 1rem;
      border: 1px solid #dee2e6;
      border-radius: .5rem;
      background: #f9f9f9;
    }
    .category-title {
      font-size: 1.25rem;
      font-weight: bold;
      margin-top: 2rem;
      color: #007bff;
    }
    .score-box {
      background: #e9f7ef;
      padding: 1rem;
      border-radius: 0.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body class="bg-light">
<div class="container mt-4 mb-5">
  <h1 class="mb-4">Questionnaire RSE : ENVIRONNEMENT, GOUVERNANCE, SOCIAL</h1>
  <form id="rse-form" role="form">
    <div id="questionnaire-container"></div>

    <div class="score-box mt-4" aria-live="polite">Score total : <span id="total-score">0</span> points</div>

    <div class="mt-4 d-flex gap-2">
      <button type="submit" class="btn btn-success">Soumettre</button>
      <button type="button" id="export-pdf" class="btn btn-outline-primary">Exporter en PDF</button>
    </div>
  </form>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  const questionnaireData =[
      { id_question: 1, rang: 1, libelle_question: "L'entreprise fait-elle un bilan carbone de ses opérations ?", categorie: "ENVIRONNEMENT", choix: "oui", points: 1 },
      { id_question: 1, rang: 1, libelle_question: "L'entreprise fait-elle un bilan carbone de ses opérations ?", categorie: "ENVIRONNEMENT", choix: "non", points: 0 },
      { id_question: 1, rang: 1, libelle_question: "L'entreprise fait-elle un bilan carbone de ses opérations ?", categorie: "ENVIRONNEMENT", choix: "oui avec suivi d'une trajectoire", points: 2 },
      { id_question: 2, rang: 2, libelle_question: "L'entreprise a-t-elle entamé une démarche d'optimisation environnementale ?", categorie: "ENVIRONNEMENT", choix: "oui avec suivi d'une trajectoire", points: 3 },
      { id_question: 2, rang: 2, libelle_question: "L'entreprise a-t-elle entamé une démarche d'optimisation environnementale ?", categorie: "ENVIRONNEMENT", choix: "aucune action", points: 0 },
      { id_question: 2, rang: 2, libelle_question: "L'entreprise a-t-elle entamé une démarche d'optimisation environnementale ?", categorie: "ENVIRONNEMENT", choix: "oui quelques actions", points: 1 },
      { id_question: 2, rang: 2, libelle_question: "L'entreprise a-t-elle entamé une démarche d'optimisation environnementale ?", categorie: "ENVIRONNEMENT", choix: "oui plusieurs actions", points: 2 },
      { id_question: 3, rang: 3, libelle_question: "Plan de continuité de la chaîne de production ?", categorie: "ENVIRONNEMENT", choix: "oui", points: 3 },
      { id_question: 3, rang: 3, libelle_question: "Plan de continuité de la chaîne de production ?", categorie: "ENVIRONNEMENT", choix: "non", points: 0 },
      { id_question: 3, rang: 3, libelle_question: "Plan de continuité de la chaîne de production ?", categorie: "ENVIRONNEMENT", choix: "non concernée", points: 1 },
      { id_question: 4, rang: 4, libelle_question: "L’entreprise tient-elle compte de la performance RSE de ses fournisseurs ?", categorie: "GOUVERNANCE", choix: "oui", points: 2 },
      { id_question: 4, rang: 4, libelle_question: "L’entreprise tient-elle compte de la performance RSE de ses fournisseurs ?", categorie: "GOUVERNANCE", choix: "pour les fournisseurs majeurs", points: 1 },
      { id_question: 4, rang: 4, libelle_question: "L’entreprise tient-elle compte de la performance RSE de ses fournisseurs ?", categorie: "GOUVERNANCE", choix: "non", points: 0 },
      { id_question: 5, rang: 5, libelle_question: "Dispositifs satisfaction client ?", categorie: "GOUVERNANCE", choix: "aucune action", points: 0 },
      { id_question: 5, rang: 5, libelle_question: "Dispositifs satisfaction client ?", categorie: "GOUVERNANCE", choix: "oui quelques actions", points: 1 },
      { id_question: 5, rang: 5, libelle_question: "Dispositifs satisfaction client ?", categorie: "GOUVERNANCE", choix: "oui plusieurs actions", points: 2 },
      { id_question: 5, rang: 5, libelle_question: "Dispositifs satisfaction client ?", categorie: "GOUVERNANCE", choix: "oui avec mesure de l'efficacité", points: 3 },
      { id_question: 6, rang: 6, libelle_question: "Pourquoi l'entreprise n'est-elle pas davantage engagée en RSE ?", categorie: "SOCIAL", choix: "", points: "" },
      { id_question: 7, rang: 7, libelle_question: "Note ECOVADIS de l'entreprise (note / 100)", categorie: "SOCIAL", choix: "", points: "" }
    ];
  
  $(document).ready(function () {
    const $container = $('#questionnaire-container');
    let totalScore = 0;
    const selectedAnswers = {};

    // Grouper par catégorie
    const grouped = {};
    questionnaireData.forEach(q => {
      if (!grouped[q.categorie]) grouped[q.categorie] = {};
      if (!grouped[q.categorie][q.id_question]) grouped[q.categorie][q.id_question] = { ...q, reponses: [] };
      if (q.choix !== "") grouped[q.categorie][q.id_question].reponses.push({ choix: q.choix, points: q.points });
    });

    // Générer l'UI du questionnaire
    for (const [cat, questions] of Object.entries(grouped)) {
      $container.append(`<div class="category-title">${cat}</div>`);
      for (const [id, question] of Object.entries(questions)) {
        const $q = $(`<div class="question-card" data-id="${question.id_question}">
          <label class="form-label fw-bold">${question.libelle_question}</label>
          <div class="choices"></div>
          <div class="form-group mt-2">
            <label for="comment-${id}">Commentaire :</label>
            <textarea id="comment-${id}" class="form-control comment-box" rows="2"></textarea>
          </div>
        </div>`);
        if (question.reponses.length > 0) {
          question.reponses.forEach((rep, i) => {
            const idRadio = `q${id}-r${i}`;
            $q.find('.choices').append(`
              <div class="form-check">
                <input class="form-check-input" type="radio" name="question-${id}" id="${idRadio}" value="${rep.points}">
                <label class="form-check-label" for="${idRadio}">${rep.choix}</label>
              </div>`);
          });
        } else {
          $q.find('.choices').remove(); // Pas de choix → pas de radio
        }
        $container.append($q);
      }
    }

    // Calcul dynamique du score
    $container.on('change', 'input[type="radio"]', function () {
      totalScore = 0;
      $('input[type="radio"]:checked').each(function () {
        totalScore += parseInt($(this).val());
      });
      $('#total-score').text(totalScore);
    });

    // Soumission
    $('#rse-form').on('submit', function (e) {
      e.preventDefault();
      const data = [];
      $('.question-card').each(function () {
        const qid = $(this).data('id');
        const score = $(this).find('input[type="radio"]:checked').val() || null;
        const comment = $(this).find('textarea').val();
        data.push({ id_question: qid, score: score ? parseInt(score) : null, commentaire: comment });
      });
      console.log("Résultats soumis :", data);
      alert("Questionnaire soumis avec succès !");
    });

    // Export PDF
    $('#export-pdf').on('click', function () {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      let y = 10;
      doc.setFontSize(14);
      doc.text("Questionnaire RSE", 10, y);
      y += 10;
      $('.question-card').each(function () {
        const label = $(this).find('label').first().text();
        const score = $(this).find('input[type="radio"]:checked + label').text() || "Non répondu";
        const comment = $(this).find('textarea').val() || "Aucun commentaire";
        doc.setFontSize(12);
        doc.text(`Q: ${label}`, 10, y);
        y += 6;
        doc.text(`Réponse: ${score}`, 10, y);
        y += 6;
        doc.text(`Commentaire: ${comment}`, 10, y);
        y += 10;
        if (y > 270) { doc.addPage(); y = 10; }
      });
      doc.text(`Score total : ${$('#total-score').text()} points`, 10, y);
      doc.save("questionnaire_RSE.pdf");
    });
  });
</script>
</body>
</html>
