<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Éditeur de Questionnaire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .question-card { margin-bottom: 1rem; }
    .drag-handle { cursor: move; }
  </style>
</head>
<body>
<div class="container py-4">
  <h1 class="mb-4">Éditeur de Questionnaire</h1>
  <div id="questionnaire"></div>
  <button class="btn btn-primary mt-3" id="add-question">Ajouter une question</button>
  <button class="btn btn-success mt-3" id="submit">Modifier</button>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
<script>
  let questionnaireData = [];

  const rawData =  [
    { id_question: 1, libelle_question: "L'entreprise fait-elle un bilan carbone de ses opérations ?", categorie: "ENVIRONNEMENT", choix: "oui", points: 1 },
    { id_question: 1, libelle_question: "L'entreprise fait-elle un bilan carbone de ses opérations ?", categorie: "ENVIRONNEMENT", choix: "non", points: 0 },
    { id_question: 1, libelle_question: "L'entreprise fait-elle un bilan carbone de ses opérations ?", categorie: "ENVIRONNEMENT", choix: "oui avec suivi d'une trajectoire", points: 2 },
    { id_question: 2, libelle_question: "L'entreprise a-t-elle entamé une démarche d'optimisation environnementale...", categorie: "ENVIRONNEMENT", choix: "oui avec suivi d'une trajectoire", points: 3 },
    { id_question: 2, libelle_question: "L'entreprise a-t-elle entamé une démarche d'optimisation environnementale...", categorie: "ENVIRONNEMENT", choix: "aucune action", points: 0 },
    { id_question: 2, libelle_question: "L'entreprise a-t-elle entamé une démarche d'optimisation environnementale...", categorie: "ENVIRONNEMENT", choix: "oui quelques actions", points: 1 },
    { id_question: 2, libelle_question: "L'entreprise a-t-elle entamé une démarche d'optimisation environnementale...", categorie: "ENVIRONNEMENT", choix: "oui plusieurs actions", points: 2 },
    { id_question: 3, libelle_question: "Plan de continuité chaîne de production ?", categorie: "ENVIRONNEMENT", choix: "oui", points: 3 },
    { id_question: 3, libelle_question: "Plan de continuité chaîne de production ?", categorie: "ENVIRONNEMENT", choix: "non", points: 0 },
    { id_question: 3, libelle_question: "Plan de continuité chaîne de production ?", categorie: "ENVIRONNEMENT", choix: "non concernée", points: 1 },
    { id_question: 4, libelle_question: "Performance RSE fournisseurs ?", categorie: "GOUVERNANCE", choix: "oui", points: 2 },
    { id_question: 4, libelle_question: "Performance RSE fournisseurs ?", categorie: "GOUVERNANCE", choix: "pour les fournisseurs majeurs", points: 1 },
    { id_question: 4, libelle_question: "Performance RSE fournisseurs ?", categorie: "GOUVERNANCE", choix: "non", points: 0 },
    { id_question: 5, libelle_question: "Satisfaction client ?", categorie: "GOUVERNANCE", choix: "aucune action", points: 0 },
    { id_question: 5, libelle_question: "Satisfaction client ?", categorie: "GOUVERNANCE", choix: "oui quelques actions", points: 1 },
    { id_question: 5, libelle_question: "Satisfaction client ?", categorie: "GOUVERNANCE", choix: "oui plusieurs actions", points: 2 },
    { id_question: 5, libelle_question: "Satisfaction client ?", categorie: "GOUVERNANCE", choix: "oui avec mesure de l'efficacité", points: 3 },
    { id_question: 6, libelle_question: "Pourquoi pas plus engagée RSE ?", categorie: "SOCIAL", choix: "", points: "" },
    { id_question: 7, libelle_question: "Note ECOVADIS (/100)", categorie: "SOCIAL", choix: "", points: "" }
  ];

  function structureData(data) {
    const grouped = {};
    data.forEach(item => {
      if (!grouped[item.id_question]) {
        grouped[item.id_question] = {
          id: item.id_question,
          rang: item.rang ?? item.id_question,
          libelle: item.libelle_question,
          categorie: item.categorie,
          type: item.choix === '' ? 'text' : 'choice',
          choix: []
        };
      }
      if (item.choix) {
        grouped[item.id_question].choix.push({ choix: item.choix, points: item.points });
      }
    });
    return Object.values(grouped).sort((a, b) => a.rang - b.rang);
  }

  function syncFormData() {
    $('.question-card').each(function (index) {
      const id = $(this).data('id');
      questionnaireData[id].rang = index + 1;
      questionnaireData[id].categorie = $(this).find('.categorie').val();
      questionnaireData[id].libelle = $(this).find('.libelle').val();
      const type = $(this).find('.type').val();
      questionnaireData[id].type = type;

      if (type === 'choice') {
        questionnaireData[id].choix = [];
        $(this).find('.choix-list .input-group').each(function () {
          const choix = $(this).find('.choix-val').val();
          const points = parseInt($(this).find('.points-val').val()) || 0;
          questionnaireData[id].choix.push({ choix, points });
        });
      }
    });
  }

  function render() {
    const container = $('#questionnaire');
    container.empty();

    questionnaireData.forEach((question, index) => {
      const card = $(
        `<div class="card question-card" data-id="${index}">
          <div class="card-body">
            <div class="d-flex justify-content-between">
              <h5 class="card-title">Question <span class="question-number">${question.rang}</span></h5>
              <span class="drag-handle"><i class="fas fa-bars"></i></span>
            </div>
            <div class="mb-2">
              <label>Catégorie</label>
              <input class="form-control categorie" value="${question.categorie || ''}"/>
            </div>
            <div class="mb-2">
              <label>Libellé de la question</label>
              <textarea class="form-control libelle">${question.libelle || ''}</textarea>
            </div>
            <div class="mb-2">
              <label>Type de question</label>
              <select class="form-control type">
                <option value="choice" ${question.type === 'choice' ? 'selected' : ''}>Choix multiples</option>
                <option value="text" ${question.type === 'text' ? 'selected' : ''}>Texte libre</option>
              </select>
            </div>
            <div class="choix-container" style="display:${question.type === 'choice' ? 'block' : 'none'}">
              <div class="choix-list"></div>
              <button class="btn btn-sm btn-outline-primary add-choix">Ajouter un choix</button>
            </div>
            <button class="btn btn-sm btn-danger mt-2 remove-question">Supprimer</button>
          </div>
        </div>`
      );

      const choixList = card.find('.choix-list');
      question.choix.forEach((c, ci) => {
        choixList.append(`
          <div class="input-group mb-1">
            <input class="form-control choix-val" value="${c.choix}" placeholder="Réponse">
            <input type="number" class="form-control points-val" value="${c.points}" placeholder="Points">
            <button class="btn btn-outline-danger remove-choix"><i class="fas fa-times"></i></button>
          </div>
        `);
      });

      card.find('.add-choix').click(() => {
        syncFormData();
        question.choix.push({ choix: '', points: 0 });
        render();
      });

      card.find('.remove-question').click(() => {
        syncFormData();
        questionnaireData.splice(index, 1);
        render();
      });

      card.find('.type').change(function () {
        syncFormData();
        question.type = $(this).val();
        if (question.type === 'text') question.choix = [];
        render();
      });

      container.append(card);
    });

    $('.choix-list').on('click', '.remove-choix', function () {
      const qIndex = $(this).closest('.question-card').data('id');
      const cIndex = $(this).closest('.input-group').index();
      questionnaireData[qIndex].choix.splice(cIndex, 1);
      render();
    });

    $('#questionnaire').sortable({
      handle: '.drag-handle',
      update: function () {
        syncFormData();
        const newData = [];
        $('.question-card').each(function () {
          const idx = $(this).data('id');
          newData.push(questionnaireData[idx]);
        });
        questionnaireData = newData.map((q, i) => ({ ...q, rang: i + 1 }));

        $('#questionnaire .question-card').each((i, el) => {
          $(el).attr('data-id', i);
        });

        render();
      }
    });
  }

  $('#add-question').click(() => {
    syncFormData();
    questionnaireData.push({
      rang: questionnaireData.length + 1,
      libelle: '',
      categorie: '',
      type: 'choice',
      choix: []
    });
    render();
  });

  $('#submit').click(() => {
    syncFormData();
    console.log('Data à envoyer :', questionnaireData);
    $.ajax({
      url: 'enregistrer_questionnaire.php',
      type: 'POST',
      data: { data: JSON.stringify(questionnaireData) },
      success: res => alert('Modifications enregistrées !'),
      error: err => alert('Erreur AJAX : ' + err.status)
    });
  });

  $(document).ready(() => {
    questionnaireData = structureData(rawData);
    render();
  });
</script>
</body>
</html>
